<title>Pulse CRM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell matching the pitch deck. Frosted header with section switcher and role picker, 1200px workspace, slide-in account drawer. */
:root {
  --bg: #f5f6f8; --surface: #ffffff; --surface-2: #edf0f4; --line: #d9dee6;
  --fg: #13213c; --fg-2: #3f4d63; --muted: #6b778a;
  --accent: #2c6390; --accent-soft: #e2ecf5; --pulse: #b31330; --pulse-soft: #f8e1e5;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
  --good: #0ca30c; --warn: #fab219; --serious: #ec835a; --crit: #d03b3b;
  --good-ink: #086b08; --warn-ink: #805300; --serious-ink: #a3421b; --crit-ink: #a8202f;
  --hero-bg: #13213c; --hero-bg-2: #1d3157; --hero-fg: #f2f5fa; --hero-fg-2: #b4c0d4; --hero-accent: #ff6f86; --hero-line: rgba(255,255,255,.13); --hero-card: rgba(255,255,255,.06);
  --grid: #e4e8ee; --axis: #c3cad4; --shadow: 0 1px 2px rgba(19,33,60,.06), 0 10px 28px rgba(19,33,60,.08);
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b1322; --surface: #111b2e; --surface-2: #17233a; --line: #25334c;
  --fg: #e8edf5; --fg-2: #aab6c8; --muted: #7d8aa0;
  --accent: #78aedc; --accent-soft: #16304a; --pulse: #f0647b; --pulse-soft: #3a1720;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70;
  --good-ink: #43c943; --warn-ink: #fab219; --serious-ink: #ef9b79; --crit-ink: #f07f8b;
  --hero-bg: #101c33; --hero-bg-2: #1b2e52;
  --grid: #1f2b40; --axis: #34425a; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.3);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0b1322; --surface: #111b2e; --surface-2: #17233a; --line: #25334c;
  --fg: #e8edf5; --fg-2: #aab6c8; --muted: #7d8aa0;
  --accent: #78aedc; --accent-soft: #16304a; --pulse: #f0647b; --pulse-soft: #3a1720;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70;
  --good-ink: #43c943; --warn-ink: #fab219; --serious-ink: #ef9b79; --crit-ink: #f07f8b;
  --hero-bg: #101c33; --hero-bg-2: #1b2e52;
  --grid: #1f2b40; --axis: #34425a; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: radial-gradient(1000px 420px at 100% -80px, color-mix(in srgb, var(--accent) 8%, transparent), transparent 70%), var(--bg); background-attachment: fixed; color: var(--fg); font-family: var(--f-body); font-size: 14px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, select, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1200px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.num, td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.up { color: var(--good-ink); font-weight: 600; } .down { color: var(--crit-ink); font-weight: 600; } .muted { color: var(--muted); }

header.app { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--surface) 86%, transparent); -webkit-backdrop-filter: saturate(1.5) blur(14px); backdrop-filter: saturate(1.5) blur(14px); border-bottom: 1px solid var(--line); }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding-block: 12px 10px; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
.bname { display: block; font-weight: 700; font-size: 20px; letter-spacing: -.02em; line-height: 1; }
.brand small { display: block; color: var(--muted); font-size: 12px; margin-top: 3px; }
.areas { display: flex; gap: 2px; background: var(--surface-2); border-radius: 10px; padding: 3px; overflow-x: auto; scrollbar-width: none; max-width: 100%; }
.areas button { border: 0; background: none; padding: 6px 12px; border-radius: 8px; font-weight: 600; color: var(--fg-2); cursor: pointer; white-space: nowrap; }
.areas button:hover { color: var(--fg); }
.areas button[aria-current="page"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(19,33,60,.14); }
.role { display: flex; align-items: center; gap: 8px; }
.role label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; white-space: nowrap; }
.role select { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; max-width: 100%; }
nav.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
nav.tabs button { background: none; border: 0; padding: 9px 12px; border-bottom: 2px solid transparent; color: var(--fg-2); font-weight: 600; cursor: pointer; white-space: nowrap; }
nav.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--pulse); }

main { padding-block: 22px 48px; display: grid; gap: 20px; }
.page-head { display: grid; gap: 2px; }
.eyebrow { margin: 0; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--pulse); font-weight: 700; }
.h-page { font-size: clamp(22px, 3vw, 30px); font-weight: 700; letter-spacing: -.02em; margin: 0; line-height: 1.15; text-wrap: balance; }
.lede { color: var(--fg-2); max-width: 70ch; margin: 6px 0 0; }
.rls { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 13px; color: var(--fg-2); background: var(--accent-soft); border-radius: 12px; padding: 10px 14px; }
.rls b { color: var(--fg); }
.rls code { font-family: var(--f-mono); font-size: 12px; background: var(--surface); padding: 2px 6px; border-radius: 5px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; min-width: 0; box-shadow: 0 1px 2px rgba(19,33,60,.04); }
.panel h2 { font-size: 16px; font-weight: 700; margin: 0; letter-spacing: -.01em; }
.panel .sub, .sub { color: var(--muted); font-size: 12.5px; margin: 2px 0 0; }
.panel-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 16px; align-items: flex-end; margin-bottom: 14px; }
.grid-2 { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 20px; }
.grid-2.even { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px 14px; display: grid; gap: 4px; align-content: start; box-shadow: 0 1px 2px rgba(19,33,60,.04); min-width: 0; }
.kpi .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.kpi .val { font-size: 30px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }
.kpi .delta { font-size: 12.5px; color: var(--fg-2); }
.kpi-spark { display: block; margin-top: 6px; }

.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 2px 8px 2px 6px; border-radius: 999px; white-space: nowrap; }
.pill svg { flex: none; }
.st-gap { color: var(--accent); background: var(--accent-soft); }
.st-decline { color: var(--crit-ink); background: color-mix(in srgb, var(--crit) 14%, transparent); }
.st-quiet { color: var(--serious-ink); background: color-mix(in srgb, var(--serious) 18%, transparent); }
.st-ramp { color: var(--warn-ink); background: color-mix(in srgb, var(--warn) 22%, transparent); }
.st-plaque { color: var(--fg-2); background: var(--surface-2); }
.st-ok { color: var(--good-ink); background: color-mix(in srgb, var(--good) 14%, transparent); }

.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--fg-2); }
.legend i { display: inline-block; width: 12px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--f-body); font-variant-numeric: tabular-nums; }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); border-radius: 8px; padding: 8px 10px; font-size: 12px; min-width: 140px; z-index: 2; }
.tip b { display: block; margin-bottom: 4px; }
.tip div { display: flex; justify-content: space-between; gap: 12px; font-variant-numeric: tabular-nums; }
.tip i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }

.list { display: grid; gap: 8px; }
.item { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; cursor: pointer; display: grid; gap: 3px; width: 100%; transition: border-color .15s, transform .15s; }
.item:hover { border-color: var(--accent); transform: translateX(2px); }
.item .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.item .name { font-weight: 600; display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
.item p { margin: 0; color: var(--fg-2); font-size: 13px; }

.who { display: flex; align-items: center; gap: 10px; }
.mono { width: 34px; height: 34px; border-radius: 10px; flex: none; display: grid; place-items: center; font-weight: 700; font-size: 12px; color: var(--accent); background: linear-gradient(140deg, var(--accent-soft), color-mix(in srgb, var(--accent-soft) 40%, var(--surface))); border: 1px solid color-mix(in srgb, var(--accent) 18%, transparent); }
.mono.sm { width: 24px; height: 24px; border-radius: 7px; font-size: 10px; }
.mono.lg { width: 48px; height: 48px; border-radius: 14px; font-size: 17px; }
.avatar { width: 30px; height: 30px; border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 700; font-size: 11px; color: var(--fg-2); background: var(--surface-2); border: 1px solid var(--line); }

.weights { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px 18px; }
.weights label { display: grid; gap: 4px; font-size: 12.5px; color: var(--fg-2); }
.weights .wl { display: flex; justify-content: space-between; gap: 6px; }
.weights .wl b { color: var(--fg); font-variant-numeric: tabular-nums; }
.weights input[type=range] { width: 100%; accent-color: var(--accent); }
.weights small { color: var(--muted); font-size: 11.5px; line-height: 1.35; }
.formula { margin-top: 12px; font-family: var(--f-mono); font-size: 12px; color: var(--fg-2); background: var(--surface-2); padding: 8px 10px; border-radius: 8px; overflow-x: auto; white-space: nowrap; }
.tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--pulse); background: var(--pulse-soft); padding: 2px 8px; border-radius: 999px; vertical-align: middle; margin-left: 6px; }

.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 12.5px; font-weight: 600; color: var(--fg-2); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--surface); border-color: var(--fg); }
.chip .n { font-variant-numeric: tabular-nums; opacity: .7; margin-left: 4px; }

.tbl-wrap { overflow-x: auto; margin: 0 -20px; padding: 0 20px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th button { background: none; border: 0; padding: 0; font: inherit; color: inherit; letter-spacing: inherit; text-transform: inherit; cursor: pointer; }
th button:hover { color: var(--fg); }
td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover td, tbody tr.sel td { background: var(--surface-2); }
td .acct { font-weight: 600; white-space: nowrap; }
.meta { color: var(--muted); font-size: 12px; }
td .meta { white-space: nowrap; }
.score { display: flex; align-items: center; gap: 8px; }
.score .track { width: 60px; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; flex: none; }
.score .fill { display: block; height: 100%; border-radius: 3px; background: var(--accent); }
.score b { font-variant-numeric: tabular-nums; width: 2ch; text-align: right; }
.untrusted { color: var(--accent); font-weight: 600; font-size: 12px; white-space: nowrap; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 12px; font-weight: 600; cursor: pointer; font-size: 13px; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn.primary { background: var(--fg); border-color: var(--fg); color: var(--surface); }
.btn.sm { padding: 4px 9px; font-size: 12px; }
.link { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; cursor: pointer; font-size: inherit; text-align: left; }
.link:hover { text-decoration: underline; }

.drawer-bg { position: fixed; inset: 0; background: rgba(8,14,26,.5); z-index: 20; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(640px, 100%); background: var(--bg); z-index: 21; overflow-y: auto; box-shadow: var(--shadow);
  padding: calc(18px + env(safe-area-inset-top, 0px)) max(18px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) 18px; display: grid; gap: 16px; align-content: start; }
.dh { display: flex; align-items: center; gap: 12px; }
.dh h2 { font-size: 22px; margin: 0; letter-spacing: -.02em; line-height: 1.15; }
.close { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; width: 34px; height: 34px; cursor: pointer; flex: none; font-size: 18px; line-height: 1; align-self: flex-start; }
.nba { border-left: 3px solid var(--pulse); background: var(--surface); border-radius: 0 12px 12px 0; padding: 12px 14px; }
.nba.gap { border-left-color: var(--accent); }
.nba .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--pulse); font-weight: 700; }
.nba.gap .lbl { color: var(--accent); }
.nba p { margin: 4px 0 0; }
.nba-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.facts { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 8px; }
.fact { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; min-width: 0; }
.fact .k { font-size: 11px; color: var(--muted); }
.fact .v { font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; }
.h3 { font-size: 15px; font-weight: 700; margin: 0 0 8px; }
.log { display: grid; }
.log > div { display: grid; grid-template-columns: 76px minmax(0,1fr); gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.log > div > span:first-child { color: var(--muted); font-variant-numeric: tabular-nums; }
.log .new { color: var(--accent); font-weight: 600; }

.form { display: grid; gap: 12px; }
.frow { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.form label.f { display: grid; gap: 4px; font-size: 12px; font-weight: 600; color: var(--fg-2); }
.form select, .form textarea { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 14px; width: 100%; font-weight: 400; }
.form textarea { resize: vertical; }
.inline { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--fg-2); }
.factions { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; }
.tasks { display: grid; }
.task { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); align-items: start; }
.task:last-child { border-bottom: 0; }
.task input { margin-top: 3px; accent-color: var(--accent); width: 16px; height: 16px; }
.task label { font-weight: 600; cursor: pointer; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--surface); padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 13.5px; z-index: 30; box-shadow: var(--shadow); width: max-content; max-width: calc(100% - 32px); }

.hero-band { position: relative; overflow: hidden; border-radius: 22px; color: var(--hero-fg); background: radial-gradient(700px 300px at 85% 0%, var(--hero-bg-2), transparent 70%), var(--hero-bg); padding: clamp(30px, 4.5vw, 50px) clamp(20px, 4vw, 44px) clamp(80px, 9vw, 108px); display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 28px; align-items: end; box-shadow: 0 20px 50px -24px rgba(19,33,60,.6); }
.hero-band::before { content: ""; position: absolute; left: clamp(20px, 4vw, 44px); top: clamp(16px, 2.5vw, 26px); width: 64px; height: 4px; background: var(--hero-accent); border-radius: 2px; }
.hero-band .eyebrow { color: var(--hero-fg-2); letter-spacing: .02em; text-transform: none; font-weight: 500; font-size: 13px; }
.thesis { font-size: clamp(30px, 4.8vw, 50px); font-weight: 700; letter-spacing: -.03em; line-height: 1.04; margin: 8px 0 0; text-wrap: balance; max-width: 18ch; }
.thesis span { color: var(--hero-accent); }
.hero-band .lede { color: var(--hero-fg-2); font-size: 15.5px; margin-top: 14px; max-width: 60ch; }
.hero-copy { display: grid; align-content: start; position: relative; z-index: 1; min-width: 0; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
.btn.hero-primary { background: var(--hero-accent); border-color: var(--hero-accent); color: #2a0710; padding: 10px 16px; font-size: 14px; }
.btn.hero-ghost { background: transparent; color: var(--hero-fg); border-color: var(--hero-line); padding: 10px 16px; font-size: 14px; }
.btn.hero-ghost:hover { border-color: var(--hero-fg-2); }
.hero-stats { display: grid; gap: 10px; position: relative; z-index: 1; min-width: 0; }
.hero-stats div { background: var(--hero-card); border: 1px solid var(--hero-line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 1px; }
.hero-stats small { color: var(--hero-fg-2); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
.hero-stats b { font-size: 28px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; }
.hero-stats span { color: var(--hero-fg-2); font-size: 12.5px; }
.hero-stats .up { color: #7ee2a0; } .hero-stats .down { color: var(--hero-accent); }
.ecg { position: absolute; left: 0; right: 0; bottom: 8px; width: 100%; height: clamp(60px, 8vw, 92px); pointer-events: none; }
.ecg path { fill: none; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.ecg-base { stroke: var(--hero-line); stroke-width: 1.5; }
.ecg-run { stroke: var(--hero-accent); stroke-width: 2.4; stroke-dasharray: 90 910; filter: drop-shadow(0 0 6px var(--hero-accent)); }
@media (prefers-reduced-motion: no-preference) { .ecg-run { animation: ecg 5.5s linear infinite; } @keyframes ecg { from { stroke-dashoffset: 1000; } to { stroke-dashoffset: 0; } } }

.doors { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.door { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 20px; display: grid; gap: 10px; align-content: start; cursor: pointer; transition: border-color .15s, transform .15s, box-shadow .15s; box-shadow: 0 1px 2px rgba(19,33,60,.04); min-width: 0; }
.door:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow); }
.door-top { display: flex; align-items: center; gap: 10px; }
.door-icon { width: 40px; height: 40px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
.door-who { font-size: 12px; color: var(--muted); font-weight: 600; }
.door-title { font-size: 20px; font-weight: 700; letter-spacing: -.02em; }
.door-desc { color: var(--fg-2); font-size: 13.5px; }
.door-preview { display: grid; gap: 6px; background: var(--surface-2); border-radius: 12px; padding: 10px 12px; min-height: 88px; align-content: center; min-width: 0; }
.pv-row { display: flex; align-items: center; gap: 8px; background: var(--surface); border-radius: 8px; padding: 6px 8px; font-size: 12.5px; min-width: 0; }
.pv-name { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pv-cap { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .07em; }

<script id="pulse-data" type="application/json">/*__PULSE_DATA__*/</script>
<script>
// ---------- Data (built by export_for_pulse.py from semantic_model.yaml) ----------
const D = JSON.parse(document.getElementById('pulse-data').textContent);
const DAY = 86400000;
const AS_OF = new Date(D.meta.as_of + 'T00:00:00Z');
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTHS = D.meta.months.map(m => MON[+m.slice(5) - 1] + ' ’' + m.slice(2, 4));
const TERR = D.meta.territories;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const fmt = n => Math.round(n).toLocaleString('en-US');
const pct = (n, d = 0) => (n * 100).toFixed(d) + '%';
const sum = arr => arr.reduce((x, y) => x + (y || 0), 0);
const fmtDate = iso => { const d = new Date(iso + 'T00:00:00Z'); return MON[d.getUTCMonth()] + ' ' + d.getUTCDate() + ', ' + d.getUTCFullYear(); };
const daysBefore = iso => Math.round((AS_OF - new Date(iso + 'T00:00:00Z')) / DAY);
const initials = name => name.replace(/^Dr\.\s*/, '').replace(/,.*$/, '').split(/\s+/).filter(w => /^[A-Z]/.test(w)).slice(0, 2).map(w => w[0]).join('');

// Same rule as the Tableau "Gone Quiet" field: 60+ days since last case and 5+ lifetime cases.
const QUIET_DAYS = 60, QUIET_LIFE = 5;
// Pulse proposals, to be agreed with TAMs before they go into the semantic model.
const QUIET_MIN = 10;      // cases at risk from quiet physicians before an account is flagged
const RAMP_UTIL = 0.17;    // under-ramped: activated in the last 12 months, 3+ months live, utilization below this
const PLAQUE_UTIL = 0.27;  // Plaque opportunity: not activated for Plaque, utilization at or above the median

const PHYS = D.physicians.map(r => ({ id:r[0], name:r[1], spec:r[2], acct:r[3], last:r[4], l90:r[5], p90:r[6], life:r[7], days:r[8], status:r[9] }));
const isQuiet = p => p.days !== null && p.days >= QUIET_DAYS && p.life >= QUIET_LIFE;
const physBy = {};
PHYS.forEach(p => (physBy[p.acct] = physBy[p.acct] || []).push(p));
const ACCOUNTS = D.accounts.map(a => {
  const events = D.events.filter(e => e.account === a.id);
  const activities = (D.activity[a.id] || []).map(x => ({ ...x }));
  events.forEach(e => activities.push({ d: daysBefore(e.date), type: e.type, note: `${e.name}: ${e.attendees.length} attendees.` }));
  activities.sort((x, y) => x.d - y.d);
  const act = new Date(a.act + 'T00:00:00Z');
  const live = (AS_OF.getUTCFullYear() - act.getUTCFullYear()) * 12 + AS_OF.getUTCMonth() - act.getUTCMonth();
  return { ...a, phys: physBy[a.id] || [], events, activities, tasks: [], live };
});
const byId = Object.fromEntries(ACCOUNTS.map(a => [a.id, a]));
const lastTouch = a => a.activities.length ? a.activities[0].d : 999;

// ---------- Signals and next actions ----------
const CAT = {
  gap:     { label:'Data gap', cls:'st-gap', color:'var(--accent)', rule:'Any missing feed day in the last 180 days. The change is not trusted; it goes to the data owner.', icon:'<path d="M2.5 6h7M2.5 3.5h7M2.5 8.5h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>' },
  decline: { label:'Review decline', cls:'st-decline', color:'var(--crit)', rule:'Complete data, 60+ cases in the earlier 90 days, and a drop of 30% or more.', icon:'<path d="M6 2v5M6 9.5v.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>' },
  quiet:   { label:'Physicians quiet', cls:'st-quiet', color:'var(--serious)', rule:`Physicians quiet ${QUIET_DAYS}+ days who sent ${QUIET_MIN}+ cases in the prior 90 days.`, icon:'<circle cx="6" cy="4.2" r="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M2.5 10c.6-2 2-3 3.5-3s2.9 1 3.5 3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>' },
  ramp:    { label:'Under-ramped', cls:'st-ramp', color:'var(--warn)', rule:`Live under 12 months, 3+ months in, utilization below ${pct(RAMP_UTIL)}.`, icon:'<path d="M2.5 9.5l2.5-3 2 1.5 2.5-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>' },
  plaque:  { label:'Plaque opportunity', cls:'st-plaque', color:'var(--axis)', rule:`Not activated for Plaque, utilization ${pct(PLAQUE_UTIL)} or higher.`, icon:'<path d="M6 3v6M3 6h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>' },
  ok:      { label:'No action', cls:'st-ok', color:'var(--good)', rule:'None of the above.', icon:'<path d="M3 6.2l2 2 4-4.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>' }
};
const CAT_ORDER = ['gap','decline','quiet','ramp','plaque','ok'];
const pill = (c, label) => `<span class="pill ${CAT[c].cls}"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">${CAT[c].icon}</svg>${label || CAT[c].label}</span>`;

const COMPONENTS = [
  { key:'util', label:'Utilization', help:'Cases ÷ estimated CCTAs, last 90 days', w:30 },
  { key:'trend', label:'Verified trend', help:'Last 90 vs prior 90 days. Skipped for data gaps', w:25 },
  { key:'breadth', label:'Physician breadth', help:'Share of physicians ordering in the last 90 days', w:15 },
  { key:'quiet', label:'Quiet physicians', help:`Fewer physicians quiet ${QUIET_DAYS}+ days scores higher`, w:15 },
  { key:'engage', label:'TAM engagement', help:'Days since the last logged touch', w:15 }
];
const state = { role:'vp', area:'hub', sub:{ crm:'today', dash:'overview' }, filter:'all', sort:{ key:'score', dir:1 }, codeTab:'cube', open:null, event:0,
  weights: Object.fromEntries(COMPONENTS.map(c => [c.key, c.w])) };

function metrics(a) {
  const util = a.l90 / (a.ccta90 || 1);
  const change = a.p90 ? (a.l90 - a.p90) / a.p90 : null;
  const quiet = a.phys.filter(isQuiet).sort((x, y) => y.p90 - x.p90);
  const atRisk = sum(quiet.map(p => p.p90));
  let cat = 'ok';
  if (a.signal === 'Data gap') cat = 'gap';
  else if (a.signal === 'Review decline') cat = 'decline';
  else if (atRisk >= QUIET_MIN) cat = 'quiet';
  else if (a.recent && a.live >= 3 && util < RAMP_UTIL) cat = 'ramp';
  else if (!a.plaqueAct && util >= PLAQUE_UTIL) cat = 'plaque';
  const s = {
    util: clamp(util / .5) * 100,
    trend: a.signal === 'Data gap' || change === null ? null : clamp((change + .4) / .8) * 100,
    breadth: a.phys.length ? a.actPhys / a.phys.length * 100 : 0,
    quiet: (1 - quiet.length / Math.max(1, a.actPhys + quiet.length)) * 100,
    engage: clamp(1 - lastTouch(a) / 90) * 100
  };
  let num = 0, den = 0;
  COMPONENTS.forEach(c => { if (s[c.key] !== null) { num += s[c.key] * state.weights[c.key]; den += state.weights[c.key]; } });
  return { util, change, quiet, atRisk, cat, s, score: den ? num / den : 0 };
}
const priority = (a, m) => CAT_ORDER.indexOf(m.cat) * 1e6 - (m.cat === 'quiet' ? m.atRisk : m.cat === 'decline' ? a.p90 - a.l90 : m.cat === 'gap' ? a.gapDays : a.ccta90);

function nextAction(a, m) {
  const q = m.quiet.slice(0, 3).map(p => `${p.name} (${p.p90} cases)`).join(', ');
  switch (m.cat) {
    case 'gap': return `Cases look ${pct(-m.change, 1)} lower (${fmt(a.p90)} to ${fmt(a.l90)}), but ${a.gapDays} feed days are missing. Don’t treat this as a decline. Send it to the data owner to restore the feed, then re-check.`;
    case 'decline': return `Cases fell ${pct(-m.change, 1)} (${fmt(a.p90)} to ${fmt(a.l90)}) and the data is complete, so the drop is real. Review it with the account this week${m.quiet.length ? `, starting with the physicians who went quiet: ${q}` : ''}.`;
    case 'quiet': return `${m.quiet.length} physician${m.quiet.length === 1 ? ' has' : 's have'} not ordered in ${QUIET_DAYS}+ days, putting ${fmt(m.atRisk)} cases a quarter at risk. Visit the top of the list: ${q}.`;
    case 'ramp': return `Live ${a.live} months and sending ${pct(m.util, 1)} of estimated CCTAs. Check the TSM to TAM handoff and the physicians who have not started ordering (${a.phys.length - a.actPhys} of ${a.phys.length}).`;
    case 'plaque': return `Strong FFRCT user at ${pct(m.util, 1)} utilization and not activated for Plaque. Propose a Plaque activation with the lead physician.`;
    default: return `No signal needs action. Keep the regular cadence; last touch ${lastTouch(a)} days ago.`;
  }
}
const ACT_FOR = { gap:'Email', decline:'Call', quiet:'Site visit', ramp:'Call', plaque:'Site visit', ok:'QBR' };
const taskFor = (a, m) => ({
  gap: [`Restore the case feed: ${a.gapDays} missing days`, 'Data owner'],
  decline: [`Review the ${pct(-m.change)} decline with the account`, a.tam],
  quiet: [m.quiet.length > 1 ? `Visit ${m.quiet[0].name} and ${m.quiet.length - 1} other quiet physicians` : `Visit ${m.quiet[0] ? m.quiet[0].name : 'the quiet physician'}`, a.tam],
  ramp: ['Review the activation handoff and ramp plan', a.tam],
  plaque: ['Propose Plaque activation', a.tam],
  ok: ['Schedule the quarterly business review', a.tam]
})[m.cat];

// Seeded open tasks for the demo
let taskSeq = 1;
function addTask(a, title, owner, due) { a.tasks.unshift({ id: 'T' + (taskSeq++), title, owner, due, done: false }); }
ACCOUNTS.forEach(a => {
  const m = metrics(a);
  if (m.cat === 'gap') addTask(a, `Restore the case feed: ${a.gapDays} missing days`, 'Data owner', [-3, 1, 4][taskSeq % 3]);
  if (m.cat === 'decline') addTask(a, `Review the ${pct(-m.change)} decline with the account`, a.tam, [-1, 2, 5, 8][taskSeq % 4]);
});
const rb = ACCOUNTS.find(a => a.name === 'Riverbend Heart Institute');
if (rb) addTask(rb, 'Visit the 4 physicians who went quiet after the Plaque dinner program', rb.tam, 0);

// ---------- Access control ----------
const ROLES = [{ id:'vp', label:'Regional VP (all territories)', terr:null }, ...TERR.map(t => ({ id:t.name, label:`${t.tam}, TAM (${t.name})`, terr:t.name }))];
const role = () => ROLES.find(r => r.id === state.role);
const visible = () => ACCOUNTS.filter(a => !role().terr || a.terr === role().terr);
function rlsBanner() {
  const r = role(), n = visible().length;
  if (r.terr) return `<div class="rls"><span><b>Territory security on.</b> ${n} of ${ACCOUNTS.length} accounts visible.</span><code>territory = '${esc(r.terr)}'</code><span>Applied once in the semantic layer, so Tableau and the assistant see the same rows.</span></div>`;
  return `<div class="rls"><span><b>All territories.</b> ${n} accounts across ${TERR.length} territories.</span><span>Sign in as a TAM to see territory security narrow every view.</span></div>`;
}

// ---------- Charts ----------
function niceStep(v) { const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }
function lineChart(el, labels, series, height = 240) {
  const W = Math.max(280, el.clientWidth || 600), H = height, m = { t:12, r:14, b:26, l:46 };
  const raw = Math.max(1, ...series.flatMap(s => s.values.filter(v => v !== null)));
  const step = niceStep(raw / 4), max = Math.ceil(raw / step) * step;
  const x = i => m.l + (W - m.l - m.r) * (labels.length === 1 ? .5 : i / (labels.length - 1));
  const y = v => m.t + (H - m.t - m.b) * (1 - v / max);
  let g = '';
  for (let v = 0; v <= max + 1e-9; v += step) {
    g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="${v === 0 ? 'var(--axis)' : 'var(--grid)'}"/>`;
    g += `<text x="${m.l - 8}" y="${y(v) + 4}" text-anchor="end">${fmt(v)}</text>`;
  }
  const every = Math.ceil(labels.length / Math.max(2, Math.floor((W - 60) / 64)));
  labels.forEach((l, i) => { if (i % every === 0 || i === labels.length - 1) g += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${l}</text>`; });
  series.forEach(s => {
    const d = s.values.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
    if (s.area) g += `<path d="${d} L${x(labels.length - 1)} ${y(0)} L${x(0)} ${y(0)} Z" fill="${s.color}" fill-opacity=".08"/>`;
    g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    const li = labels.length - 1;
    g += `<circle cx="${x(li)}" cy="${y(s.values[li])}" r="4" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`;
  });
  g += `<line class="hl" y1="${m.t}" y2="${H - m.b}" stroke="var(--axis)" visibility="hidden"/>`;
  g += `<g class="dots" visibility="hidden">${series.map(s => `<circle r="4" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`).join('')}</g>`;
  g += `<rect class="hit" x="${m.l}" y="0" width="${W - m.l - m.r}" height="${H}" fill="transparent"/>`;
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(series.map(s => s.name).join(', '))} by month">${g}</svg><div class="tip" hidden></div>`;

// ---------- How it's built ----------
function qualityChecks() {
  const out = [], G = D.governed, T = totals(ACCOUNTS), o = G.overall;
  const r1 = x => Math.round(x * 1000) / 10, r3 = x => Math.round(x * 1000) / 1000;
  const mine = { account_count: T.n, cases_last_90d: T.l90, cases_prior_90d: T.p90, case_change_pct: r1(T.change), verified_case_change_pct: r1(T.verified), est_utilization: r3(T.util), accounts_with_data_gaps: T.gaps };
  const miss = Object.keys(mine).filter(k => Math.abs(mine[k] - o[k]) > 1e-9);
  const terrMiss = TERR.filter(t => { const x = totals(ACCOUNTS.filter(a => a.terr === t.name)), g = G.by_territory[t.name]; return !g || x.l90 !== g.cases_last_90d || r1(x.change) !== g.case_change_pct || r3(x.util) !== g.est_utilization; }).map(t => t.name);
  out.push({ state: miss.length || terrMiss.length ? 'fail' : 'pass', title: 'Pulse totals match the semantic layer',
    note: miss.length || terrMiss.length ? `Mismatch in ${[...miss, ...terrMiss].join(', ')}.` : `${fmt(T.l90)} cases, ${pct(T.util, 1)} utilization, ${r1(T.change)}% raw and ${r1(T.verified)}% verified change: identical to the governed measures, overall and in all ${TERR.length} territories.` });
  const banned = /patient|dob|birth|mrn|ssn/i, keys = [...Object.keys(D.accounts[0]), 'physician_id', 'physician_name', 'specialty', 'account_id', 'last_case_date', 'cases_last_90d', 'cases_prior_90d', 'lifetime_cases', 'activity_status'];
  out.push({ state: keys.some(k => banned.test(k)) ? 'fail' : 'pass', title: 'No patient fields reach the CRM', note: 'Pulse receives account and physician aggregates only. The same rule fails the build in test_no_patient_columns_anywhere.' });
  const gaps = ACCOUNTS.filter(a => a.signal === 'Data gap');
  out.push({ state: gaps.length ? 'warn' : 'pass', title: 'Case feed coverage', note: gaps.length ? `${gaps.map(a => `${a.name} (${a.gapDays} days)`).join(', ')} have missing feed days. They are labeled Data gap, routed to the data owner, and left out of the verified change.` : 'Every account’s feed arrived on every day.' });
  const partial = D.events.filter(e => daysBefore(e.date) < 90);
  out.push({ state: partial.length ? 'warn' : 'pass', title: 'Program follow-up windows complete', note: partial.length ? `${partial.length} programs are less than 90 days old, so their after window is still filling. They are marked partial.` : 'All follow-up windows are complete.' });
  return out;
}

    <aside class="drawer${keep ? '' : ' enter'}" role="dialog" aria-modal="true" aria-labelledby="dr-title">
      <div class="dh"><span class="mono lg">${initials(a.name)}</span><div style="flex:1;min-width:0"><div class="meta">${a.id} · ${a.type} · ${esc(a.terr)} · ${esc(a.tam)}</div><h2 id="dr-title">${esc(a.name)}</h2>
        <div style="margin-top:6px;display:flex;flex-wrap:wrap;gap:8px;align-items:center">${pill(m.cat)}<span class="meta">Live since ${fmtDate(a.act)} · Plaque ${a.plaqueAct ? 'since ' + fmtDate(a.plaqueAct) : 'not activated'} · last touch ${lastTouch(a) === 0 ? 'today' : lastTouch(a) + 'd ago'}</span></div></div>
        <button class="close" data-close aria-label="Close">×</button></div>
      <div class="nba ${m.cat === 'gap' ? 'gap' : ''}"><div class="lbl">Recommended next step</div><p>${esc(nextAction(a, m))}</p>
        <div class="nba-actions"><button class="btn primary" id="nb-task">Create Salesforce Task for ${esc(towner)}</button><button class="btn" id="nb-log">Log a ${ACT_FOR[m.cat] === 'QBR' ? 'QBR' : ACT_FOR[m.cat].toLowerCase()}</button></div></div>
      <div class="facts">
        <div class="fact"><div class="k">Cases 90d</div><div class="v">${fmt(a.l90)}</div></div>
        <div class="fact"><div class="k">vs prior 90d</div><div class="v">${m.cat === 'gap' ? '<span class="untrusted">Not trusted</span>' : delta(m.change)}</div></div>
        <div class="fact"><div class="k">Est. utilization</div><div class="v">${pct(m.util, 1)}</div></div>
        <div class="fact"><div class="k">Ordering physicians</div><div class="v">${a.actPhys}<span class="meta"> / ${a.phys.length}</span></div></div>
        <div class="fact"><div class="k">Missing feed days</div><div class="v ${a.gapDays ? 'untrusted' : ''}">${a.gapDays}</div></div>
      </div>
      <div class="panel"><div class="panel-head"><div><h2>Open tasks</h2><p class="sub">Written back to Salesforce as Tasks</p></div></div>${taskList(open.map(t => ({ a, t })), false)}</div>
      <div class="panel"><div class="panel-head"><div><h2>Cases by month</h2><p class="sub">${MONTHS[start]} to ${MONTHS[MONTHS.length - 1]}${a.gapDays ? ` · ${a.gapDays} missing feed days pull the latest months down` : ''}</p></div>${legend(series)}</div><div class="chart" id="dr-chart"></div></div>
      <div class="panel"><div class="panel-head"><div><h2>Physicians</h2><p class="sub">Gone quiet first, ranked by cases in the prior 90 days</p></div></div>
        <div class="tbl-wrap"><table><thead><tr><th>Physician</th><th>Status</th><th class="num">90d</th><th class="num">Prior 90d</th><th class="num">Last case</th></tr></thead><tbody>
        ${phys.map(p => `<tr><td><div class="who"><span class="avatar">${initials(p.name)}</span><div><div class="acct">${esc(p.name)}</div><div class="meta">${esc(p.spec)}${isQuiet(p) ? ' · <span class="down">gone quiet</span>' : ''}</div></div></div></td><td><span class="pill ${PST[p.status]}">${p.status}</span></td><td class="num">${p.l90}</td><td class="num">${p.p90}</td><td class="num">${p.days === null ? '<span class="muted">never</span>' : p.days + 'd ago'}</td></tr>`).join('')}
        </tbody></table></div></div>
      ${a.events.length ? `<div class="panel"><div class="panel-head"><div><h2>Programs at this account</h2><p class="sub">Attendee cases, 90 days before vs after</p></div></div>
        ${a.events.map(e => { const q = e.attendees.filter(x => x[4] === 'Went quiet'); return `<p style="margin:0 0 6px"><b>${esc(e.name)}</b> <span class="meta">· ${fmtDate(e.date)}</span><br>${e.attendees.length} attendees, ${sum(e.attendees.map(x => x[2]))} cases before → ${sum(e.attendees.map(x => x[3]))} after${q.length ? `. <span class="down">Went quiet: ${esc(q.map(x => x[0]).join(', '))}</span>` : ''}.</p>`; }).join('')}</div>` : ''}
      <form class="panel form" id="log-form" novalidate>
        <div class="panel-head" style="margin-bottom:0"><div><h2>Log activity</h2><p class="sub">Saved to the timeline; a Salesforce Activity record in production</p></div></div>
        <div class="frow">
          <label class="f" for="lf-type">Type<select id="lf-type">${['Call','Site visit','Email','QBR','Program follow-up'].map(t => `<option>${t}</option>`).join('')}</select></label>
          <label class="f" for="lf-phys">With<select id="lf-phys"><option value="">No specific physician</option>${phys.slice(0, 25).map(p => `<option>${esc(p.name)}</option>`).join('')}</select></label>
        </div>
        <label class="f" for="lf-note">Notes<textarea id="lf-note" rows="2" placeholder="What happened, and what comes next?"></textarea></label>
        <div class="factions"><label class="inline" for="lf-task"><input type="checkbox" id="lf-task"> Create a follow-up Task in 14 days</label><button class="btn primary" type="submit">Log activity</button></div>
      </form>
      <div><h3 class="h3">Activity timeline</h3><div class="log">${a.activities.map(x => `<div><span>${x.d === 0 ? '<span class="new">Today</span>' : x.d + 'd ago'}</span><span><b>${esc(x.type)}.</b> ${esc(x.note)}</span></div>`).join('')}</div>
        <p class="sub" style="margin-top:8px">Calls, visits, and emails are seeded demo CRM activity. Programs come from the events data.</p></div>
    </aside>`;
  root.querySelector('.drawer').scrollTop = scroll;
  lineChart(document.getElementById('dr-chart'), MONTHS.slice(start), series, 200);
  root.querySelectorAll('[data-close]').forEach(el => el.addEventListener('click', closeAccount));
  const form = document.getElementById('log-form'), typeSel = document.getElementById('lf-type');
  document.getElementById('nb-task').addEventListener('click', () => {
    addTask(a, ttitle, towner, 7); renderDrawer(true); refreshView();
    toast(`Task created for ${towner}, due in 7 days. In production this writes a Salesforce Task.`);
  });
  document.getElementById('nb-log').addEventListener('click', () => {
    typeSel.value = ACT_FOR[m.cat]; form.scrollIntoView({ behavior: 'smooth', block: 'center' }); document.getElementById('lf-note').focus({ preventScroll: true });
  });
  form.addEventListener('submit', e => {
    e.preventDefault();
    const before = Math.round(metrics(a).score), type = typeSel.value, withP = document.getElementById('lf-phys').value, note = document.getElementById('lf-note').value.trim();
    a.activities.unshift({ d: 0, type, note: (withP ? `With ${withP}. ` : '') + (note || 'No notes added.') });
    if (document.getElementById('lf-task').checked) addTask(a, `Follow up after the ${type === 'QBR' ? 'QBR' : type.toLowerCase()}`, a.tam, 14);
    const after = Math.round(metrics(a).score);
    renderDrawer(true); refreshView();
    toast(`${type} logged. Priority score ${before} → ${after}.`);
  });
}

// ---------- Shell ----------
const AREAS = [{ id:'hub', label:'Home', hash:'home' }, { id:'crm', label:'CRM', hash:'crm' }, { id:'dash', label:'Dashboard', hash:'dashboard' }, { id:'built', label:'How it’s built', hash:'built' }];
const SUBTABS = { hub: [], built: [],
  crm: [{ id:'today', label:'Today' }, { id:'accounts', label:'Accounts' }, { id:'activations', label:'Activations' }],
  dash: [{ id:'overview', label:'Overview' }, { id:'territories', label:'Territories' }, { id:'programs', label:'Programs' }] };
const VIEWS = { hub: renderHub, today: renderToday, accounts: renderAccounts, activations: renderActivations, overview: renderOverview, territories: renderTerritories, programs: renderPrograms, built: renderBuilt };
const currentView = () => SUBTABS[state.area].length ? state.sub[state.area] : state.area;
const roleSel = document.getElementById('role');
roleSel.innerHTML = ROLES.map(r => `<option value="${esc(r.id)}">${esc(r.label)}</option>`).join('');
roleSel.addEventListener('change', e => { state.role = e.target.value; state.event = 0; closeAccount(); render(); });
function setRole(id) { if (ROLES.some(r => r.id === id)) { state.role = id; roleSel.value = id; state.event = 0; } }
function goto(area, sub) {
  state.area = area; if (sub) state.sub[area] = sub;
  closeAccount(); render(); window.scrollTo(0, 0);
  try { history.replaceState(null, '', '#' + AREAS.find(a => a.id === area).hash); } catch (e) {}
}
function render() {
  const subs = SUBTABS[state.area];
  document.getElementById('areas').innerHTML = AREAS.map(a => `<button data-go="${a.id}" ${state.area === a.id ? 'aria-current="page"' : ''}>${a.label}</button>`).join('');
  const tabs = document.getElementById('tabs');
  tabs.hidden = !subs.length;
  tabs.innerHTML = subs.map(t => `<button role="tab" aria-selected="${state.sub[state.area] === t.id}" data-go="${state.area}|${t.id}">${t.label}</button>`).join('');
  VIEWS[currentView()]();
}
document.addEventListener('click', e => {
  const go = e.target.closest('[data-go]');
  if (go) {
    if (go.dataset.role) setRole(go.dataset.role);
    if (go.dataset.filter) state.filter = go.dataset.filter;
    const [area, sub] = go.dataset.go.split('|');
    goto(area, sub);
    if (go.dataset.thenOpen) openAccount(go.dataset.thenOpen);
    return;
  }
  const t = e.target.closest('[data-open]'); if (t) openAccount(t.dataset.open);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && state.open) closeAccount();
  if (e.key === 'Enter' && e.target.matches('tr[data-open]')) openAccount(e.target.dataset.open);
  if (e.key === 'Enter' && e.target.matches('tr[data-ev]')) e.target.click();
});
let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (currentView() === 'overview') renderOverview(); if (state.open) renderDrawer(true); }, 150); });
document.getElementById('foot').textContent = `Concept prototype by Rutuja Hande. All data is synthetic, generated by generate_data.py (snapshot ${fmtDate(D.meta.as_of)}), with no patient data anywhere. Built from ${D.meta.source} by export_for_pulse.py.`;
const startArea = AREAS.find(a => '#' + a.hash === location.hash);
if (startArea) state.area = startArea.id;
render();
</script>
